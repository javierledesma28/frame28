# Instaladores en máquinas limpias (F28-229): ejecuta docs/install.ps1 y docs/install.sh de esta rama, sin preguntas,
# en Windows, macOS y Ubuntu de GitHub Actions, y termina con frame28 doctor. Las imágenes de Actions traen Node, Git y
# Python: se apartan (se renombran sus carpetas y binarios tras el checkout) para que el instalador los tenga que poner
# como en un equipo recién estrenado. Con solo limpiar el PATH no bastaba: el instalador recarga el PATH del sistema.
name: instaladores

on:
  workflow_dispatch:
  push:
    branches: ["instal*"]
    paths: ["docs/install.ps1", "docs/install.sh", ".github/workflows/instaladores.yml"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Simular un equipo nuevo (apartar Node, Git y Python)
        shell: pwsh
        run: |
          # Git se desinstala de verdad (si solo se aparta, winget cree que sigue instalado y no lo pone)
          if (Test-Path "C:\Program Files\Git\unins000.exe") { Start-Process "C:\Program Files\Git\unins000.exe" -ArgumentList "/VERYSILENT","/NORESTART" -Wait; "desinstalado: Git" }
          $dirs = @("C:\Program Files\nodejs", "C:\Program Files\Git", "C:\hostedtoolcache\windows\Python", "C:\hostedtoolcache\windows\node")
          foreach ($d in $dirs) { if (Test-Path $d) { Rename-Item $d ((Split-Path $d -Leaf) + "_apartado"); "apartado: $d" } }
      - name: Instalador (sin preguntas)
        shell: powershell   # Windows PowerShell 5.1, como en el equipo de un cliente
        run: |
          "Antes: node=" + [bool](Get-Command node -ErrorAction SilentlyContinue) + " git=" + [bool](Get-Command git -ErrorAction SilentlyContinue)
          $env:FRAME28_YES = "1"
          Invoke-Expression (Get-Content docs/install.ps1 -Raw)
          "--- seguimos vivos tras el instalador (no cerro la sesion)"
      - name: Registro y doctor
        if: always()
        shell: powershell
        run: |
          Get-Content "$env:USERPROFILE\frame28-install.log" -Tail 80
          $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User") + ";$env:USERPROFILE\.local\bin"
          frame28 doctor
      - name: Segunda vez = actualizar (F28-102)
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User") + ";$env:USERPROFILE\.local\bin"
          $env:FRAME28_YES = "1"
          Invoke-Expression (Get-Content docs/install.ps1 -Raw)
          Select-String -Path "$env:USERPROFILE\frame28-install.log" -Pattern "Ya tienes Frame28|Todo estaba al dia|actualizado"

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalador (sin preguntas)
        run: |
          # apartar Node y uv de Actions (y git en Ubuntu; en macOS git viene con las herramientas de Apple que pide Homebrew)
          for b in node npm npx uv; do p=$(command -v $b 2>/dev/null) && sudo mv "$p" "$p.apartado" && echo "apartado: $p"; done
          if [ "$(uname)" = "Linux" ]; then sudo apt-get remove -y git >/dev/null && echo "desinstalado: git"; fi
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -viE 'node|hostedtoolcache|/uv' | paste -sd: -)"
          echo "Antes: node=$(command -v node || echo no) git=$(command -v git || echo no)"
          bash docs/install.sh -y
      - name: Registro y doctor
        if: always()
        run: |
          tail -80 "$HOME/frame28-install.log"
          export PATH="$HOME/.local/bin:$PATH"; [ -x /opt/homebrew/bin/brew ] && eval "$(/opt/homebrew/bin/brew shellenv)"
          frame28 doctor
      - name: Segunda vez = actualizar (F28-102)
        run: |
          export PATH="$HOME/.local/bin:$PATH"; [ -x /opt/homebrew/bin/brew ] && eval "$(/opt/homebrew/bin/brew shellenv)"
          bash docs/install.sh -y
          grep -E "Ya tienes Frame28|Todo estaba al día|actualizado" "$HOME/frame28-install.log"
