<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;background:#0A0A0A;color:#F2F1EC;font-family:Inter,"Segoe UI",Arial,sans-serif;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;padding:56px 72px 96px;box-sizing:border-box;gap:40px}
.eb{font-family:"Space Mono","Cascadia Mono",Consolas,monospace;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#A9A8A0;margin-bottom:22px}

p{margin:22px 0 0;font-size:23px;line-height:1.35;color:#A9A8A0;max-width:560px}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.p{border-radius:10px;background:#161614;border:1px solid #2A2A26}
.long{grid-column:span 4;aspect-ratio:16/4.5;background:#F2F1EC}
.s{aspect-ratio:9/16;background:#F5C500;border-color:#F5C500}
.c{grid-column:span 2;aspect-ratio:16/9}.q{aspect-ratio:1}
.foot{position:absolute;left:72px;bottom:44px;font-family:"Space Mono",monospace;font-size:20px;color:#A9A8A0;letter-spacing:.06em}
.foot b{color:#fff}.foot i{color:#F5C500;font-style:normal;font-weight:700}
</style></head><body>
