  <text x="20" y="46" font-family="Space Mono,Courier,monospace" font-size="9" fill="#707070" letter-spacing="1">FOUNDATION + PRODUCT ACCENTS</text>
  <!-- Row 1: Foundation -->
  <g transform="translate(20,64)">
    <rect width="100" height="60" rx="8" fill="#F5C500"/>
