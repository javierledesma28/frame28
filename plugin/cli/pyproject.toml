[project]
name = "frame28"
version = "0.1.0"
description = "Frame28 by Think28 · CLI: deterministic steps for talking-head explainer videos (prep, transcribe, matte, build, render)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Think28" }, { name = "Javier Ledesma" }]
urls = { Homepage = "https://think28.app/frame28", Repository = "https://github.com/javierledesma28/frame28" }
dependencies = [
  "click>=8.1",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "faster-whisper>=1.0",
  "mediapipe>=0.10.14",
]

[project.scripts]
frame28 = "frame28.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frame28"]
