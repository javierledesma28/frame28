[project]
name = "frame28"
dynamic = ["version"]
description = "Frame28 by Think28 · CLI: deterministic steps for talking-head explainer videos (prep, transcribe, matte, build, render)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Think28" }, { name = "Javier Ledesma" }]
urls = { Homepage = "https://frame28.t28.io", Repository = "https://github.com/javierledesma28/frame28" }
dependencies = [
  "click>=8.1",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "faster-whisper>=1.0",
  "av>=11,<18",
  "mediapipe>=0.10.14",
  "rapidocr>=3.0",
  "segno>=1.6",
]

[project.scripts]
frame28 = "frame28.cli:run"

[tool.hatch.version]
path = "frame28/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frame28"]
