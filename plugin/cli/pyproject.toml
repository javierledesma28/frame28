[project]
name = "frame28"
dynamic = ["version"]
description = "Frame28 by Think28 · CLI: deterministic steps for talking-head explainer videos (prep, transcribe, matte, build, render)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Think28" }, { name = "Javier Ledesma" }]
urls = { Homepage = "https://frame28.t28.io", Repository = "https://github.com/javierledesma28/frame28" }
# Rangos con techo en la siguiente versión mayor (F28-91): una mayor nueva de una librería (PyAV 19 rompió faster-whisper)
# no entra sin probarla. Las versiones exactas que reciben los clientes van en el extra `probado`.
dependencies = [
  "click>=8.1,<9",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<6",
  "onnxruntime>=1.17,<2",
  "faster-whisper>=1.0,<2",
  "av>=11,<18",
  "mediapipe>=0.10.14,<2",
  "rapidocr>=3.0,<4",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
# GPU NVIDIA: las librerías de CUDA 12 que ctranslate2 (faster-whisper) carga en tiempo de ejecución y onnxruntime-gpu
# (matte y OCR). onnxruntime-gpu da el mismo módulo que onnxruntime, así que el de CPU se excluye al instalar:
# uv tool install --editable "./plugin/cli[gpu]" --python 3.12 --excludes ./plugin/cli/excluir-gpu.txt --reinstall
# (unos 3 GB; sin esto todo va por CPU). `frame28 doctor` da la orden exacta para cada instalación.
gpu = [
  "nvidia-cublas-cu12>=12,<13; sys_platform != 'darwin'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
  "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27; sys_platform != 'darwin'",
]
# Las versiones exactas con las que pasaron las pruebas (F28-91): cada paquete que instalan las dependencias de arriba,
# en todas las plataformas. Lo instalan el instalador, `uv tool upgrade` y las órdenes de `frame28 doctor`
# ("frame28[probado] @ git+…"), y con él corren las pruebas (`uv run --extra probado --group dev pytest`). No se edita a
# mano: `python scripts/fijar-dependencias.py --escribir` (o --actualizar) lo rehace y sin opciones lo comprueba.
probado = [
  "absl-py==2.5.0",
  "antlr4-python3-runtime==4.9.3",
  "anyio==4.15.1",
  "av==17.1.0",
  "certifi==2026.7.22",
  "cffi==2.1.1",
  "charset-normalizer==3.5.2",
  "click==8.5.0",
  "colorama==0.4.6 ; sys_platform == 'win32'",
  "colorlog==6.12.0",
  "contourpy==1.3.3 ; python_full_version < '3.12'",
  "contourpy==1.4.0 ; python_full_version >= '3.12'",
  "ctranslate2==4.8.2",
  "cycler==0.12.1",
  "faster-whisper==1.2.1",
  "filelock==4.0.12",
  "flatbuffers==25.12.19",
  "fonttools==4.66.1",
  "fsspec==2026.9.0",
  "h11==0.16.0",
  "hf-xet==1.6.0 ; platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'arm64' or platform_machine == 'x86_64'",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "huggingface-hub==1.33.0",
  "idna==3.20",
  "kiwisolver==1.5.1",
  "matplotlib==3.11.2",
  "mediapipe==1.0.1",
  "numpy==2.4.6 ; python_full_version < '3.12'",
  "numpy==2.5.3 ; python_full_version >= '3.12'",
  "omegaconf==2.3.1",
  "onnxruntime==1.30.0",
  "opencv-contrib-python==5.0.0.93",
  "opencv-python==5.0.0.93",
  "opencv-python-headless==5.0.0.93",
  "packaging==26.3",
  "pillow==12.3.0",
  "protobuf==7.36.2",
  "pyclipper==1.4.0",
  "pycparser==3.0 ; implementation_name != 'PyPy'",
  "pyparsing==3.3.3",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.3",
  "rapidocr==3.9.2",
  "requests==2.34.2",
  "segno==1.6.6",
  "shapely==2.1.2",
  "six==1.17.0",
  "sounddevice==0.5.6",
  "tokenizers==0.23.2",
  "tqdm==4.70.1",
  "typing-extensions==4.16.0",
  "urllib3==2.8.0",
]

[project.scripts]
frame28 = "frame28.cli:run"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.version]
path = "frame28/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frame28"]
