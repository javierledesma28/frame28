# frame28.app — nginx del sitio estático, detrás del túnel de Cloudflare (ver docker-compose.yml).
# Traduce `site/_headers` y `site/_redirects` (formato de Cloudflare Pages, que aquí nadie lee) a nginx. Si cambia
# uno de esos dos ficheros, cambia esto también.
# Reglas aprendidas en los otros sitios del servidor:
#  - Un add_header dentro de un location anula TODOS los del server: las cabeceras se declaran una sola vez a nivel
#    de server y lo que varía por ruta va en un map (nginx omite la cabecera cuando el valor es "").
#  - Cache-Control sin `always`: con `always` se añadía también a los 404 y Cloudflare los cacheaba un año.
#  - absolute_redirect off: detrás del túnel nginx no conoce el host público; las redirecciones «/ruta → /ruta/»
#    salen relativas y Cloudflare las sirve bajo https://frame28.app.

map $uri $f28_cache {
    default            "";
    ~^/assets/         "public, max-age=86400";
}

# Área de clientes: no indexar (el acceso lo pondrá Cloudflare Access). Mientras Access no exista, las rutas
# devuelven 404 más abajo: sin Access serían públicas.
map $uri $f28_robots {
    default                  "";
    ~^/(kb|curso)/           "noindex, nofollow";
    ~^/en/(kb|course)/       "noindex, nofollow";
}

# www → apex (cloudflared conserva el Host original)
server {
    listen 80;
    listen [::]:80;
    server_name www.frame28.app;
    return 301 https://frame28.app$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name frame28.app _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras (todas aquí; ningún location define add_header propio). Las de seguridad son las de site/_headers.
    add_header Cache-Control $f28_cache;
    add_header X-Robots-Tag $f28_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # site/_redirects
    location ~ ^/roadmap/?$  { return 302 https://frame28.t28.io/roadmap/; }
    location ~ ^/plugin/?$   { return 302 https://frame28.t28.io/; }
    location ~ ^/founders/?$ { return 301 /en/founders/; }
    location ~ ^/contact/?$  { return 301 /en/contact/; }
    location ~ ^/terms/?$    { return 301 /en/terms/; }
    # Las páginas de casos se publican solo con permiso escrito del cliente; hasta entonces llevan al contacto.
    location ^~ /casos/      { return 302 /contacto/; }
    location ^~ /en/cases/   { return 302 /en/contact/; }

    # Fuentes del generador y ficheros de Cloudflare Pages: no forman parte del sitio publicado (deploy.sh no los
    # sube; esto es defensa en profundidad por si alguien copia site/ entero).
    location ~ ^/(src|content|functions)(/|$)                          { return 404; }
    location ~ /(build\.py|README\.md|wrangler\.toml|_headers|_redirects)$ { return 404; }

    # Formulario de contacto: hasta que exista el Worker de /api/contact (con el envío de email), la página enseña
    # su mensaje de fallback («escríbenos a hola@frame28.app») al recibir un error.
    location = /api/contact {
        default_type application/json;
        return 503 '{"ok":false,"error":"send_unavailable"}';
    }

    # Área de clientes cerrada hasta que Cloudflare Access esté delante. Quitar estas dos líneas al activarlo.
    location ~ ^/(kb|curso)(/|$)      { return 404; }
    location ~ ^/en/(kb|course)(/|$)  { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
